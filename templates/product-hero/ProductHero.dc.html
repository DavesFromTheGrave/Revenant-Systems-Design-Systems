<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

      <div style="display:inline-flex;align-items:center;gap:10px;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#9c7b45;margin-bottom:22px;">
        <span style="font-size:16px;">ᛉ</span> Revenant Systems LLC

      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
        <x-import component-from-global-scope="RS.Button" variant="primary" size="lg">Explore the lineup</x-import>

    </div>

      <img src="../../assets/brand/cyborg-skull-obsidian.png" alt="Obsidian cybernetic skull with gold circuit traces and turquoise inlay" style="width:520px;max-width:46vw;filter:drop-shadow(0 0 60px rgba(31,169,168,0.22));">
    </div>

  </div>
