<!-- @dsCard group="Colors" viewport="700x150" name="Bone & semantic" subtitle="Warm off-white text + ember / amber / arcane accents." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:18px;font-family:var(--font-mono)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sw{height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between;padding:0 10px;border:1px solid rgba(255,255,255,.06)}
  .n{font-size:10px;font-weight:700}
  .h{font-size:9px;opacity:.75}
</style></head><body>
<div class="grid">
  <div class="sw" style="background:var(--bone-100);color:#000"><span class="n">bone 100</span><span class="h">#f3efe2</span></div>
  <div class="sw" style="background:var(--bone-200);color:#000"><span class="n">bone 200</span><span class="h">#e7e1cf</span></div>
  <div class="sw" style="background:var(--bone-400);color:#000"><span class="n">bone 400</span><span class="h">#92a094</span></div>
  <div class="sw" style="background:var(--bone-500);color:#fff"><span class="n">bone 500</span><span class="h">#6b7a6e</span></div>
  <div class="sw" style="background:var(--ember-500);color:#fff"><span class="n">ember</span><span class="h">malice</span></div>
  <div class="sw" style="background:var(--amber-500);color:#000"><span class="n">amber</span><span class="h">warn</span></div>
  <div class="sw" style="background:var(--arcane-400);color:#000"><span class="n">arcane</span><span class="h">live</span></div>
  <div class="sw" style="background:var(--info-500);color:#000"><span class="n">info</span><span class="h">trace</span></div>
</div>
</body></html>
