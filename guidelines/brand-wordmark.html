<!-- @dsCard group="Deprecated" viewport="700x220" name="Legacy wordmark lockups" subtitle="Deprecated — early flat wordmarks. Use the obsidian set or the Jade & Gold wordmarks." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:0;font-family:var(--font-mono);display:flex}
  .a{flex:1;background:var(--grad-void);display:flex;align-items:center;justify-content:center;padding:24px}
  .b{flex:1;background:#0a0f0b;display:flex;align-items:center;justify-content:center;padding:24px;border-left:1px solid var(--border-hair)}
  img{max-width:100%;max-height:150px;object-fit:contain}
  .cap{position:absolute;bottom:8px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-400)}
  .wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
.a img,.b img{filter:grayscale(1) brightness(.6);opacity:.55}</style></head><body>
  <div class="a"><div class="wrap"><img src="../assets/brand/wordmark-gold.png" alt="Revenant Systems gold wordmark"><span class="cap">gold foil · on void</span></div></div>
  <div class="b"><div class="wrap"><img src="../assets/brand/wordmark-jade.jpg" alt="Revenant Systems jade wordmark"><span class="cap">jade · on black</span></div></div>
</body></html>
