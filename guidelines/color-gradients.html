<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:18px;font-family:var(--font-mono)}
  .row{display:flex;gap:8px}
  .g{flex:1;height:116px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.08);display:flex;align-items:flex-end;padding:8px}
  .l{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
</style></head><body>
<div class="row">
  <div class="g" style="background:var(--grad-jade)"><span class="l">turquoise stone</span></div>
  <div class="g" style="background:var(--grad-gold)"><span class="l" style="color:#2a1c08;text-shadow:none">gold marbling</span></div>
  <div class="g" style="background:var(--grad-ember)"><span class="l">ember forge</span></div>
  <div class="g" style="background:var(--grad-void);border-color:var(--border-hair)"><span class="l">void wash</span></div>
</div>
</body></html>
