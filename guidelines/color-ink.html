<!-- @dsCard group="Colors" viewport="700x150" name="Ink — obsidian & slate" subtitle="Obsidian-black surfaces, slate borders. Cool, never green, never pure grey." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:18px;font-family:var(--font-mono)}
  .row{display:flex;gap:6px}
  .sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid rgba(255,255,255,.06)}
  .n{font-size:10px;font-weight:700;color:rgba(255,255,255,.88)}
  .h{font-size:9px;color:rgba(255,255,255,.62)}
  .dark .n,.dark .h{color:rgba(0,0,0,.75)}
  .sw{border-color:var(--border-hair)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--ink-900)"><span class="n">900 void</span><span class="h">#07080a</span></div>
  <div class="sw" style="background:var(--ink-850)"><span class="n">850 inset</span><span class="h">#0b0d10</span></div>
  <div class="sw" style="background:var(--ink-800)"><span class="n">800 surf</span><span class="h">#111418</span></div>
  <div class="sw" style="background:var(--ink-750)"><span class="n">750 raise</span><span class="h">#161a1f</span></div>
  <div class="sw" style="background:var(--ink-700)"><span class="n">700 card</span><span class="h">#1c2127</span></div>
  <div class="sw" style="background:var(--ink-600)"><span class="n">600 hair</span><span class="h">#2a3038</span></div>
  <div class="sw" style="background:var(--ink-500)"><span class="n">500 edge</span><span class="h">#3a424c</span></div>
</div>
</body></html>
