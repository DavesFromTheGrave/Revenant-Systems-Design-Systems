<!-- @dsCard group="Colors" viewport="700x150" name="Gold — secondary" subtitle="Muted inlay gold, accretion-disk light. Core #9c7b45." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:18px;font-family:var(--font-mono)}
  .row{display:flex;gap:6px}
  .sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid rgba(255,255,255,.06)}
  .n{font-size:10px;font-weight:700;color:rgba(255,255,255,.88)}
  .h{font-size:9px;color:rgba(255,255,255,.62)}
  .dark .n,.dark .h{color:rgba(0,0,0,.75)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--gold-900)"><span class="n">900</span><span class="h">#2f2416</span></div>
  <div class="sw" style="background:var(--gold-800)"><span class="n">800</span><span class="h">#4a3822</span></div>
  <div class="sw" style="background:var(--gold-700)"><span class="n">700</span><span class="h">#654d2d</span></div>
  <div class="sw" style="background:var(--gold-600)"><span class="n">600</span><span class="h">#806339</span></div>
  <div class="sw dark" style="background:var(--gold-500);box-shadow:var(--glow-gold-sm)"><span class="n">500 ★</span><span class="h">#9c7b45</span></div>
  <div class="sw dark" style="background:var(--gold-400)"><span class="n">400</span><span class="h">#b08c50</span></div>
  <div class="sw dark" style="background:var(--gold-300)"><span class="n">300</span><span class="h">#c4a263</span></div>
  <div class="sw dark" style="background:var(--gold-100)"><span class="n">100</span><span class="h">#e6d3a4</span></div>
</div>
</body></html>
