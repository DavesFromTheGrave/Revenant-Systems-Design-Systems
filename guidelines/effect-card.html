<!-- @dsCard group="Effects" viewport="700x210" name="Card anatomy" subtitle="Dark raised surface · hairline · cold shadow · edge bevel. Active gains a turquoise rim." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:24px;font-family:var(--font-sans);display:flex;gap:20px}
  .card{flex:1;background:var(--bg-card);border:1px solid var(--border-hair);border-radius:var(--radius-lg);box-shadow:var(--shadow-md),var(--bevel-top);padding:18px}
  .card.active{border-color:var(--border-jade);box-shadow:var(--shadow-lg),var(--glow-jade-sm)}
  .ey{font-family:var(--font-cyber);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-500)}
  .t{font-family:var(--font-cyber);font-size:18px;font-weight:700;color:var(--bone-100);margin:6px 0 8px}
  .p{font-size:13px;color:var(--text-muted);line-height:1.5}
  .active .ey{color:var(--jade-400)}
</style></head><body>
  <div class="card"><div class="ey">Default</div><div class="t">Operator: Containment</div><div class="p">Bounds context, trims text, limits memory before the draft is generated.</div></div>
  <div class="card active"><div class="ey">◈ Active</div><div class="t">Operator: Omega</div><div class="p">Recursive refinement running. Turquoise rim + glow signal the runtime is alive.</div></div>
</body></html>
