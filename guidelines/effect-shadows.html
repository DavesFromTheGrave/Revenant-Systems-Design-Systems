<!-- @dsCard group="Effects" viewport="700x180" name="Shadows & glows" subtitle="Cold deep shadows · turquoise / gold / ember glows." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-surface);padding:26px 24px;font-family:var(--font-mono)}
  .row{display:flex;gap:22px;flex-wrap:wrap}
  .c{display:flex;flex-direction:column;align-items:center;gap:10px}
  .b{width:78px;height:56px;background:var(--bg-card);border:1px solid var(--border-hair);border-radius:var(--radius-md)}
  .l{font-size:10px;color:var(--bone-400)}
</style></head><body>
<div class="row">
  <div class="c"><div class="b" style="box-shadow:var(--shadow-sm)"></div><span class="l">shadow sm</span></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><span class="l">shadow md</span></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><span class="l">shadow lg</span></div>
  <div class="c"><div class="b" style="box-shadow:var(--glow-jade-md);border-color:var(--border-jade)"></div><span class="l">glow turquoise</span></div>
  <div class="c"><div class="b" style="box-shadow:var(--glow-gold-sm);border-color:var(--border-gold)"></div><span class="l">glint gold</span></div>
  <div class="c"><div class="b" style="box-shadow:var(--glow-ember);border-color:color-mix(in oklab,var(--ember-500) 45%,transparent)"></div><span class="l">glow ember</span></div>
</div>
</body></html>
