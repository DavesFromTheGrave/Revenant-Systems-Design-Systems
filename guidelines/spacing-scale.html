<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:20px 24px;font-family:var(--font-mono)}
  .row{display:flex;align-items:flex-end;gap:14px;height:100px}
  .c{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--grad-jade-soft);border-radius:var(--radius-xs);width:26px}
  .l{font-size:10px;color:var(--bone-400)}
</style></head><body>
<div class="row">
  <div class="c"><div class="bar" style="height:4px"></div><span class="l">1·4</span></div>
  <div class="c"><div class="bar" style="height:8px"></div><span class="l">2·8</span></div>
  <div class="c"><div class="bar" style="height:12px"></div><span class="l">3·12</span></div>
  <div class="c"><div class="bar" style="height:16px"></div><span class="l">4·16</span></div>
  <div class="c"><div class="bar" style="height:24px"></div><span class="l">5·24</span></div>
  <div class="c"><div class="bar" style="height:32px"></div><span class="l">6·32</span></div>
  <div class="c"><div class="bar" style="height:48px"></div><span class="l">7·48</span></div>
  <div class="c"><div class="bar" style="height:64px"></div><span class="l">8·64</span></div>
  <div class="c"><div class="bar" style="height:90px"></div><span class="l">9·96</span></div>
</div>
</body></html>
