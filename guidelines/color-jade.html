<!-- @dsCard group="Colors" viewport="700x150" name="Turquoise — primary" subtitle="The inlaid stone, the living current. Core #1fa9a8. (--jade-* aliases this scale.)" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:18px;font-family:var(--font-mono)}
  .row{display:flex;gap:6px}
  .sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid rgba(255,255,255,.06)}
  .n{font-size:10px;font-weight:700;color:rgba(255,255,255,.88)}
  .h{font-size:9px;color:rgba(255,255,255,.62)}
  .dark .n,.dark .h{color:rgba(0,0,0,.75)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--turq-900)"><span class="n">900</span><span class="h">#0b3538</span></div>
  <div class="sw" style="background:var(--turq-800)"><span class="n">800</span><span class="h">#0f4f52</span></div>
  <div class="sw" style="background:var(--turq-700)"><span class="n">700</span><span class="h">#136b6e</span></div>
  <div class="sw" style="background:var(--turq-600)"><span class="n">600</span><span class="h">#178a8b</span></div>
  <div class="sw dark" style="background:var(--turq-500);box-shadow:var(--glow-jade-sm)"><span class="n">500 ★</span><span class="h">#1fa9a8</span></div>
  <div class="sw dark" style="background:var(--turq-400)"><span class="n">400</span><span class="h">#33c4c1</span></div>
  <div class="sw dark" style="background:var(--turq-300)"><span class="n">300</span><span class="h">#4fd4d0</span></div>
  <div class="sw dark" style="background:var(--turq-200)"><span class="n">200</span><span class="h">#7ce3df</span></div>
  <div class="sw dark" style="background:var(--arcane-400)"><span class="n">glow</span><span class="h">#5ee6e0</span></div>
</div>
</body></html>
