<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--obsidian-900,#07080a);padding:18px 22px;font-family:var(--font-mono);display:flex;flex-direction:column;gap:14px}
.h{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-400)}
.tag{border:1px solid currentColor;padding:3px 8px;color:var(--gold-400)}
.row{display:flex;gap:20px;justify-content:center}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.c img{height:120px;object-fit:contain;filter:grayscale(1) brightness(.6);opacity:.55}
.l{font-size:10px;color:var(--bone-400);letter-spacing:.08em;}

<div class="h"><span>Legacy · jade era</span><span class="tag" style="color:#b5655a">Deprecated</span></div>
<div class="row">
<div class="c"><img src="../assets/brand/metatron-skull.jpg" alt="Metatron skull"><span class="l">Metatron</span></div>
<div class="c"><img src="../assets/brand/cog-skull.png" alt="Cog skull"><span class="l">Gear</span></div>
<div class="c"><img src="../assets/brand/hex-rune-skull.png" alt="Hex rune skull"><span class="l">Hex-rune</span></div>
<div class="c"><img src="../assets/brand/dave-of-the-dead.jpg" alt="Crowned skull"><span class="l">Crowned</span></div>
</div>
</body></html>
