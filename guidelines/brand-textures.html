<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg-void);padding:16px;font-family:var(--font-mono);display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:165px;gap:10px}
.t{border-radius:var(--radius-md);border:1px solid var(--border-hair);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-md)}
.t span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-100);background:rgba(7,8,10,.82);padding:3px 6px;border-radius:3px}
</style></head><body>
<div class="t" style="background-image:url('../assets/brand/texture-obsidian-kintsugi.jpg')"><span>Kintsugi</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-kintsugi-wide.jpg')"><span>Kintsugi · wide</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-kintsugi-tall.jpg')"><span>Kintsugi · tall</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-hex-gold.jpg')"><span>Hex · gold</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-hex-turquoise.jpg')"><span>Hex · turquoise</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-circuit-chips.jpg')"><span>Circuit · chips</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-circuit-board.jpg')"><span>Circuit · board</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-circuit-wide.jpg')"><span>Circuit · wide</span></div>
<div class="t" style="background-image:url('../assets/brand/texture-hex-turquoise-2.jpg')"><span>Hex · turquoise 2</span></div>
<div class="t" style="background:var(--grad-horizon)"><span>--grad-horizon</span></div>
</body></html>
