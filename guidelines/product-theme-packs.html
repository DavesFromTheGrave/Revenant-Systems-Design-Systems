<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html{background:var(--bg-void)}
body{margin:0;min-height:100vh;box-sizing:border-box;background:var(--grad-void);padding:16px;font-family:var(--font-mono);display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.c{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.c img{width:100%;flex:1;min-height:0;object-fit:contain;background:#1b1b1b;border-radius:var(--radius-md);border:1px solid var(--border-hair)}
.l{font-size:9px;color:var(--bone-400);letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div class="c"><img src="../assets/screens/theme-ruby-grid.png" alt=""><span class="l">Ruby · 34 icons</span></div>
<div class="c"><img src="../assets/screens/theme-jade-gold.png" alt="" style="background:#fff"><span class="l">Jade & Gold · retro</span></div>
<div class="c"><img src="../assets/screens/theme-gunmetal-list-2.png" alt=""><span class="l">Gunmetal · 100+ icons</span></div>
<div class="c"><img src="../assets/screens/theme-black-suede-gold.png" alt="" style="background:#fff"><span class="l">Black Suede & Gold</span></div>
<div class="c"><img src="../assets/screens/theme-gunmetal-list.png" alt=""><span class="l">Gunmetal · list view</span></div>
<div class="c"><img src="../assets/screens/theme-ruby-list.png" alt=""><span class="l">Ruby · list view</span></div>
</body></html>
