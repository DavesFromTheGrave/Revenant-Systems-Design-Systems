<!-- @dsCard group="Spacing" viewport="700x150" name="Radii — forged, not rounded" subtitle="2 → 12px. Pills only for status tags." -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-void);padding:20px 24px;font-family:var(--font-mono)}
  .row{display:flex;gap:16px;align-items:center}
  .c{display:flex;flex-direction:column;align-items:center;gap:8px}
  .b{width:74px;height:64px;background:var(--bg-card);border:1px solid var(--border-gold)}
  .l{font-size:10px;color:var(--bone-400)}
</style></head><body>
<div class="row">
  <div class="c"><div class="b" style="border-radius:var(--radius-xs)"></div><span class="l">xs 2</span></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-sm)"></div><span class="l">sm 3</span></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-md)"></div><span class="l">md 5 ★</span></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-lg)"></div><span class="l">lg 8</span></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-xl)"></div><span class="l">xl 12</span></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-pill);width:110px"></div><span class="l">pill</span></div>
</div>
</body></html>
